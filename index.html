","min":20,"max":100,"default":100,"unit":5,"display_unit":"percent"},{"group":"\ucc28\ub7c9\uac04\uaca9","name":"TFollowDecelBoost","title":"\uac10\uc18d \uc2dc \ucc28\uac04 \uc5ec\uc720(0%)","descr":"\uac10\uc18d \uac15\ub3c4\uc5d0 \ub530\ub77c \uae30\uc900 \ubaa9\ud45c \uac04\uaca9\uc5d0 \ucd94\uac00 \uc5ec\uc720\ub97c \ud55c \ubc88\ub9cc \ub354\ud569\ub2c8\ub2e4. \uac10\uc18d\uc774 \uc9c0\uc18d\ub418\uc5b4\ub3c4 \uac19\uc740 \ubcf4\uc815\uc774 \ubc18\ubcf5 \ub204\uc801\ub418\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \uac12\uc774 \ud074\uc218\ub85d \uc5ec\uc720\uac00 \ucee4\uc9c0\uace0, \uac10\uc18d\uc774 \uc57d\ud574\uc9c0\uba74 \ucd94\uac00 \uc5ec\uc720\ub97c \uc11c\uc11c\ud788 \uc904\uc785\ub2c8\ub2e4. 0%\ub294 \ucd94\uac00 \uc5ec\uc720\ub97c \ub044\uba70 \uc774\ubbf8 \uc801\uc6a9\ub41c \uc5ec\uc720\ub294 \uc11c\uc11c\ud788 \ud574\uc81c\ub429\ub2c8\ub2e4. \uac10\uc18d \uc911 \uae30\uc900 \ucc28\uac04 \ucd95\uc18c \ubcf4\ub958\ub294 \uc720\uc9c0\ud569\ub2c8\ub2e4.","egroup":"FDIST","etitle":"Deceleration Gap Margin (0%)","edescr":"Adds a single deceleration-dependent margin to the baseline target gap without accumulating it during sustained braking. Higher values add more space. Extra margin releases progressively as braking eases. 0% disables added margin; any already-applied margin releases gradually. Baseline gap-reduction hold during deceleration remains active.","cgroup":"\u8ddf\u8f66\u8ddd\u79bb","ctitle":"\u51cf\u901f\u65f6\u8f66\u8ddd\u4f59\u91cf (0%)","cdescr":"\u6839\u636e\u51cf\u901f\u5f3a\u5ea6\u5728\u57fa\u7840\u76ee\u6807\u8f66\u8ddd\u4e0a\u53ea\u589e\u52a0\u4e00\u6b21\u4f59\u91cf\uff0c\u6301\u7eed\u51cf\u901f\u65f6\u4e0d\u4f1a\u91cd\u590d\u7d2f\u52a0\u3002\u6570\u503c\u8d8a\u9ad8\u4f59\u91cf\u8d8a\u5927\uff0c\u51cf\u901f\u51cf\u5f31\u65f6\u9010\u6e10\u91ca\u653e\u30020%\u5173\u95ed\u989d\u5916\u4f59\u91cf\uff0c\u5df2\u65bd\u52a0\u7684\u4f59\u91cf\u4f1a\u9010\u6e10\u89e3\u9664\u3002\u51cf\u901f\u65f6\u4ecd\u4fdd\u7559\u57fa\u7840\u8f66\u8ddd\u7f29\u77ed\u6682\u505c\u529f\u80fd\u3002","min":0,"max":100,"default":0,"unit":10,"display_unit":"percent"},{"group":"\uac10\uc18d\uc81c\uc5b4","name":"AutoCurveSpeedLowerLimit","title":"\ucee4\ube0c\uc18d\ub3c4 \ucd5c\uc800\uc18d\ub3c4(30)","descr":"\ucee4\ube0c \ucd5c\uc800\uc18d\ub3c4 \uc124\uc815","egroup":"FDIST","etitle":"AutoCurveSpeed LowerLimit(30)","edescr":"Curve Minimum Speed Setting","cgroup":"\u8ddf\u8f66\u8ddd\u79bb","ctitle":"\u5f2f\u9053\u81ea\u52a8\u51cf\u901f\u4e0b\u9650 (30)","cdescr":"\u5f2f\u9053\u6700\u4f4e\u901f\u5ea6\u8bbe\u7f6e","min":10,"max":200,"default":30,"unit":10,"display_unit":"speedKph"},{"group":"\uc8fc\ud589\ud29c\ub2dd","name":"StoppingAccel","title":"\uc815\uc9c0\uc2dc\uc791\uac00\uc18d\ub3c4x0.01(-50)","descr":"\uc815\uc9c0 \uc81c\uc5b4 \uc9c4\uc785 \uac00\uc18d\ub3c4\uc640 \uc815\uc9c0 \uac10\uc18d \ubaa9\ud45c\ub97c \uc870\uc815\ud569\ub2c8\ub2e4. -100~-50\ub9cc \uc124\uc815\ud560 \uc218 \uc788\uc73c\uba70 -50\uc740 -0.50m/s\u00b2\uc785\ub2c8\ub2e4. \ub354 \uc74c\uc218\uc77c\uc218\ub85d \uac10\uc18d \ubaa9\ud45c\uac00 \uac15\ud574\uc9d1\ub2c8\ub2e4. \uc774\ubbf8 \ub354 \uac15\ud55c \uac10\uc18d\uc740 \uc720\uc9c0\ud558\uba70, \uc18c\ud504\ud2b8\ud640\ub4dc\ub294 \ucc28\uc885\ubcc4 \uc815\uc9c0 \uc720\uc9c0 \uac00\uc18d\ub3c4\ub97c \uc0ac\uc6a9\ud569\ub2c8\ub2e4. \ubcc0\uacbd\uc740 \uc8fc\ud589 \uc911\uc5d0\ub3c4 \uc57d 1\ucd08 \uc548\uc5d0 \ubc18\uc601\ub429\ub2c8\ub2e4.","egroup":"LONG","etitle":"StoppingStartAccelx0.01(-50)","edescr":"Adjust the stop-entry acceleration threshold and stopping target. Only -100 to -50 is allowed; -50 means -0.50 m/s\u00b2. More negative values request stronger deceleration. Existing stronger braking is retained, and soft hold uses the vehicle-specific hold acceleration. Changes apply within about one second, including while driving.","cgroup":"\u7eb5\u5411\u63a7\u5236","ctitle":"\u505c\u6b62\u8d77\u6b65\u52a0\u901f\u5ea6 x0.01(-50)","cdescr":"\u8c03\u6574\u505c\u6b62\u63a7\u5236\u7684\u52a0\u901f\u5ea6\u8fdb\u5165\u9608\u503c\u548c\u51cf\u901f\u76ee\u6807\u3002\u4ec5\u53ef\u8bbe\u7f6e-100\u81f3-50\uff1b-50\u4ee3\u8868-0.50m/s\u00b2\u3002\u6570\u503c\u8d8a\u8d1f\uff0c\u51cf\u901f\u76ee\u6807\u8d8a\u5f3a\u3002\u5df2\u6709\u66f4\u5f3a\u7684\u5236\u52a8\u8bf7\u6c42\u4fdd\u6301\u4e0d\u53d8\uff0c\u8f6f\u4fdd\u6301\u4f7f\u7528\u8f66\u578b\u7684\u505c\u8f66\u4fdd\u6301\u52a0\u901f\u5ea6\u3002\u4fee\u6539\u7ea6\u4e00\u79d2\u5185\u751f\u6548\uff0c\u884c\u9a76\u4e2d\u4e5f\u9002\u7528\u3002","min":-100,"max":-50,"default":-50,"unit":10},{"group":"\uac00\uc18d\uc124\uc815","name":"MyDrivingMode","title":"\ub4dc\ub77c\uc774\ube0c\ubaa8\ub4dc:(3)","descr":"1: \uc5d0\ucf54 - \ucd5c\ub300 \uac00\uc18d\ub3c4 \u00d70.9, \uc2dc\uac04 \ucc28\uac04 \u00d71.1, \uc55e\ucc28 \ubc18\uc751 \ucd5c\ub300 2.\n2: \uc548\uc804 - \ucd5c\ub300 \uac00\uc18d\ub3c4 \u00d70.8, \uc2dc\uac04 \ucc28\uac04 \u00d71.2, \uc55e\ucc28 \ubc18\uc751 \ucd5c\ub300 3. \uba40\ub9ac\uc11c\ubd80\ud130 \ucc9c\ucc9c\ud788 \uac10\uc18d\ud558\ub3c4\ub85d \uc81c\ub3d9 \uc5ec\uc720\ub97c \ub461\ub2c8\ub2e4.\n3: \uc77c\ubc18 - \uae30\ubcf8 \uac00\uc18d\u00b7\ucc28\uac04\uacfc \uc120\ud0dd\ud55c \uc55e\ucc28 \ubc18\uc751\uc744 \uc0ac\uc6a9\ud569\ub2c8\ub2e4.\n4: \uace0\uc18d - \ucd5c\ub300 \uac00\uc18d\ub3c4 \u00d71.2, \uc120\ud0dd\ud55c \uc55e\ucc28 \ubc18\uc751 \uc720\uc9c0. \uc2e0\ud638\ub4f1 \uc790\ub3d9 \uc815\uc9c0\ub294 \uc0ac\uc6a9\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.\n\ubaa8\ub4dc\ubcc4 \ubcc4\ub3c4 \uc800\ud06c \ubcf4\uc815\uc740 \uc5c6\uc73c\uba70 \ubaa8\ub4dc \ucc28\uac04 \uc5ec\uc720\ub294 \ubcf5\uadc0 \ub54c \uc11c\uc11c\ud788 \uc904\uc5b4\ub4ed\ub2c8\ub2e4. \ub0ae\uc740 \ubc18\uc751 \uc124\uc815\uacfc 0\uc740 \uc62c\ub9ac\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.","egroup":"ACCEL","etitle":"DrivingMode:Init(3)","edescr":"1: Eco - Maximum acceleration \u00d70.9, time gap \u00d71.1, lead response capped at 2.\n2: Safe - Maximum acceleration \u00d70.8, time gap \u00d71.2, lead response capped at 3, with more allowance for earlier gentle braking.\n3: Normal - Baseline acceleration and gap with the selected lead response.\n4: High - Maximum acceleration \u00d71.2 with the selected response; traffic-light stopping is disabled.\nThere is no separate mode-specific jerk adjustment. Mode gap allowance releases gradually. Lower response choices and 0 are never raised.","cgroup":"\u52a0\u901f\u8bbe\u7f6e","ctitle":"\u9a7e\u9a76\u6a21\u5f0f: \u521d\u59cb (3)","cdescr":"1: \u8282\u80fd - \u6700\u5927\u52a0\u901f\u5ea6\u00d70.9\uff0c\u65f6\u95f4\u8f66\u8ddd\u00d71.1\uff0c\u524d\u8f66\u54cd\u5e94\u6700\u9ad82\u3002\n2: \u5b89\u5168 - \u6700\u5927\u52a0\u901f\u5ea6\u00d70.8\uff0c\u65f6\u95f4\u8f66\u8ddd\u00d71.2\uff0c\u524d\u8f66\u54cd\u5e94\u6700\u9ad83\uff0c\u5e76\u4fdd\u7559\u63d0\u524d\u5e73\u7f13\u51cf\u901f\u7684\u4f59\u91cf\u3002\n3: \u666e\u901a - \u57fa\u672c\u52a0\u901f\u548c\u8f66\u8ddd\uff0c\u4f7f\u7528\u6240\u9009\u54cd\u5e94\u3002\n4: \u9ad8\u901f - \u6700\u5927\u52a0\u901f\u5ea6\u00d71.2\uff0c\u4fdd\u7559\u6240\u9009\u54cd\u5e94\uff0c\u7981\u7528\u7ea2\u7eff\u706f\u505c\u8f66\u3002\n\u4e0d\u518d\u53e0\u52a0\u6a21\u5f0f\u4e13\u7528\u7684\u52a0\u52a0\u901f\u5ea6\u8c03\u6574\uff0c\u6a21\u5f0f\u8f66\u8ddd\u4f59\u91cf\u9010\u6e10\u91ca\u653e\u3002\u8f83\u4f4e\u54cd\u5e94\u503c\u548c0\u4e0d\u4f1a\u63d0\u9ad8\u3002","min":1,"max":4,"default":3,"unit":1},{"group":"\uac00\uc18d\uc124\uc815","name":"MyDrivingModeAuto","title":"\ub4dc\ub77c\uc774\ube0c\ubaa8\ub4dc: \uc790\ub3d9","descr":"0:\uc218\ub3d9, 1:\uc77c\ubc18\u2194\uc548\uc804, 2:\uc5d0\ucf54\u2194\uc548\uc804. \uc815\uc9c0\ucc28 \uc811\uadfc\uc740 \ube60\ub974\uac8c \uc548\uc804\uc73c\ub85c \uc804\ud658\ud558\uace0 \uc9c0\uc18d \uc11c\ud589\ub3c4 \uc548\uc804\uc73c\ub85c \ud310\ub2e8\ud569\ub2c8\ub2e4. \uc815\uc9c0 \uc811\uadfc\uc774 \uc544\ub2d0 \ub54c \uc55e\ucc28 \uac00\uc18d\ub3c4\uac00 1.5m/s\u00b2\ub97c \ucd08\uacfc\ud558\ub294 \uc0c1\ud0dc\uac00 \uc57d 0.5\ucd08 \uc774\uc5b4\uc9c0\uba74 \ubcf5\uadc0\ud569\ub2c8\ub2e4. \uadf8 \uc678\uc5d0\ub294 \uc9c0\uc18d\uc801\uc778 \ud750\ub984 \ud68c\ubcf5\uc774\ub098 \uc8fc\ud589 \uc911 \uc55e\ucc28 \uc5c6\ub294 \uc0c1\ud0dc\ub97c \ud655\uc778\ud55c \ub4a4 \ubcf5\uadc0\ud569\ub2c8\ub2e4. \uace0\uc18d\uc740 \uc790\ub3d9 \uc120\ud0dd\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.","egroup":"ACCEL","etitle":"DrivingMode: Auto","edescr":"0: Manual, 1: Normal\u2194Safe, 2: Eco\u2194Safe. Stopping-lead approaches enter Safe promptly; sustained slow following also selects Safe. Outside a stopping approach, lead acceleration above 1.5m/s\u00b2 for about 0.5 seconds restores the base mode. Otherwise, sustained flow recovery or a clear road while moving restores it. High is never selected automatically.","cgroup":"\u52a0\u901f\u8bbe\u7f6e","ctitle":"\u9a7e\u9a76\u6a21\u5f0f: \u81ea\u52a8","cdescr":"0:\u624b\u52a8\uff0c1:\u666e\u901a\u2194\u5b89\u5168\uff0c2:\u8282\u80fd\u2194\u5b89\u5168\u3002\u63a5\u8fd1\u505c\u6b62\u524d\u8f66\u65f6\u8fc5\u901f\u8fdb\u5165\u5b89\u5168\u6a21\u5f0f\uff0c\u6301\u7eed\u4f4e\u901f\u8ddf\u8f66\u4e5f\u4f1a\u8fdb\u5165\u3002\u4e0d\u6ee1\u8db3\u505c\u8f66\u63a5\u8fd1\u6761\u4ef6\u65f6\uff0c\u524d\u8f66\u52a0\u901f\u5ea6\u8d85\u8fc71.5m/s\u00b2\u5e76\u6301\u7eed\u7ea60.5\u79d2\u5373\u53ef\u8fd4\u56de\u3002\u5426\u5219\u9700\u786e\u8ba4\u4ea4\u901a\u6301\u7eed\u6062\u590d\u6216\u884c\u9a76\u4e2d\u524d\u65b9\u6301\u7eed\u65e0\u8f66\u3002\u4e0d\u4f1a\u81ea\u52a8\u9009\u62e9\u9ad8\u901f\u6a21\u5f0f\u3002","min":0,"max":2,"default":0,"unit":1},{"group":"\uac10\uc18d\uc81c\uc5b4","name":"TrafficLightDetectMode","title":"\uc2e0\ud638\uac10\uc9c0 \uae30\ub2a5","descr":"0:\uc2e0\ud638\uac10\uc9c0\uc548\ud568\n 1:\uc2e0\ud638\uc815\uc9c0\ub9cc \uac10\uc9c0\n 2:\uc2e0\ud638\uc815\uc9c0/\ucd9c\ubc1c \ubaa8\ub450","egroup":"SPEED","etitle":"TrafficLightDetectMode","edescr":"0:None,1:Stopping only, 2:Stop & Go","cgroup":"\u901f\u5ea6\u63a7\u5236","ctitle":"\u7ea2\u7eff\u706f\u68c0\u6d4b\u6a21\u5f0f","cdescr":"0: \u65e0, 1: \u4ec5\u505c\u6b62, 2: \u505c\u6b62\u548c\u8d77\u6b65","min":0,"max":2,"default":2,"unit":1},{"group":"\uac10\uc18d\uc81c\uc5b4","name":"AutoNaviRearCameraHoldDistance","title":"\ud6c4\uba74\ub2e8\uc18d \ud1b5\uacfc \ud6c4 \uc720\uc9c0 \uac70\ub9ac(m)","descr":"\uc678\ubd80 \ub0b4\ube44\uac00 \ud6c4\uba74 \uacfc\uc18d \ub610\ub294 \ud6c4\uba74 \uc2e0\ud638\u00b7\uacfc\uc18d \uce74\uba54\ub77c(TMAP 75/76)\ub97c \uc548\ub0b4\ud558\uba74 \uce74\uba54\ub77c \uc9c0\uc810\uc744 \uc9c0\ub09c \ub4a4 \uc774 \uac70\ub9ac\ub9cc\ud07c \ubaa9\ud45c\uc18d\ub3c4 \uc81c\ud55c\uc744 \uc720\uc9c0\ud569\ub2c8\ub2e4. \ub9c8\uc9c0\ub9c9 50m \uc811\uadfc\uc5d0\uc11c \uc704\uce58\ub97c \uae30\uc5b5\ud558\uba70 \uc548\ub0b4\uac00 \uc0ac\ub77c\uc9c0\uac70\ub098 \ub2e4\uc74c \ud56d\ubaa9\uc73c\ub85c \ubc14\ub00c\uc5b4\ub3c4 \uc8fc\ud589\uac70\ub9ac\ub85c \ucd94\uc801\ud569\ub2c8\ub2e4. \ub2e8\uc704\ub294 m\uc774\uba70 0\uc740 \ucd94\uac00 \uc720\uc9c0\ub97c \ub055\ub2c8\ub2e4. \uac12\uc744 \ub192\uc774\uba74 \ub354 \uba40\ub9ac\uae4c\uc9c0 \uc720\uc9c0\ud569\ub2c8\ub2e4. \uc815\ucc28 \uc911\uc5d0\ub294 \uac70\ub9ac\uac00 \uc904\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \uc5f0\uacb0 \uc885\ub8cc\u00b7\uacbd\ub85c \uc774\ud0c8\u00b7\ub0b4\ube44 \uc138\uc158 \ubcc0\uacbd \uc2dc \ud574\uc81c\ud569\ub2c8\ub2e4. \uc21c\uc815 CAN\uc758 \ud6c4\uba74 \uc5ec\ubd80\ub294 \uad6c\ubd84\ud558\uc9c0 \ubabb\ud558\ubbc0\ub85c \uc21c\uc815 \uacbd\uace0\uc5d0\ub294 \uc774 \uac70\ub9ac\ub97c \uc801\uc6a9\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \uce74\uc6b4\ud2b8\ub2e4\uc6b4 \uc885\ub8cc\ub294 \uc18d\ub3c4 \uc720\uc9c0 \uc885\ub8cc\uc640 \ub2e4\ub985\ub2c8\ub2e4.","egroup":"SPEED","etitle":"Rear Camera Post-pass Hold Distance (m)","edescr":"When external navigation reports a rear speed or rear signal-and-speed camera (TMAP 75/76), retain the target-speed cap for this distance beyond the camera. The position is captured within the final 50 m and tracked by traveled distance even when guidance disappears or changes to the next item. Units are meters; 0 disables the extra hold. Increasing the value holds the cap farther beyond the camera. Stopping does not consume the distance. Disconnection, off-route status, or a new navigation session clears it. This distance does not apply to stock CAN warnings because their rear-camera type is not identified. Countdown completion does not end the speed hold.","cgroup":"\u901f\u5ea6\u63a7\u5236","ctitle":"\u540e\u5411\u6444\u50cf\u5934\u901a\u8fc7\u540e\u4fdd\u6301\u8ddd\u79bb(m)","cdescr":"\u5916\u90e8\u5bfc\u822a\u62a5\u544a\u540e\u5411\u6d4b\u901f\u6216\u540e\u5411\u95ef\u7ea2\u706f\u53ca\u6d4b\u901f\u6444\u50cf\u5934\uff08TMAP 75/76\uff09\u65f6\uff0c\u901a\u8fc7\u6444\u50cf\u5934\u540e\u7ee7\u7eed\u5728\u6b64\u8ddd\u79bb\u5185\u4fdd\u6301\u76ee\u6807\u901f\u5ea6\u4e0a\u9650\u3002\u5728\u6700\u540e50\u7c73\u8bb0\u5f55\u4f4d\u7f6e\uff0c\u5373\u4f7f\u63d0\u793a\u6d88\u5931\u6216\u5207\u6362\u5230\u4e0b\u4e00\u9879\u76ee\uff0c\u4ecd\u6309\u884c\u9a76\u8ddd\u79bb\u8ddf\u8e2a\u3002\u5355\u4f4d\u4e3a\u7c73\uff1b0\u5173\u95ed\u989d\u5916\u4fdd\u6301\u3002\u589e\u5927\u6570\u503c\u4f1a\u4fdd\u6301\u66f4\u8fdc\uff0c\u505c\u8f66\u4e0d\u6d88\u8017\u8ddd\u79bb\u3002\u65ad\u5f00\u8fde\u63a5\u3001\u504f\u79bb\u8def\u7ebf\u6216\u5bfc\u822a\u4f1a\u8bdd\u53d8\u5316\u65f6\u6e05\u9664\u3002\u539f\u8f66CAN\u65e0\u6cd5\u8bc6\u522b\u540e\u5411\u7c7b\u578b\uff0c\u56e0\u6b64\u6b64\u8ddd\u79bb\u4e0d\u9002\u7528\u4e8e\u539f\u8f66\u8b66\u544a\u3002\u5012\u8ba1\u65f6\u7ed3\u675f\u4e0d\u4ee3\u8868\u4fdd\u6301\u7ed3\u675f\u3002","min":0,"max":300,"default":100,"unit":10,"risk":"high"},{"group":"\uac10\uc18d\uc81c\uc5b4","name":"AutoNaviSpeedCtrlEnd","title":"\uacfc\uc18d\uce74\uba54\ub77c\uac10\uc18d \uc644\ub8cc \uc2dc\uac04(6\ucd08)","descr":"\uac10\uc18d\uc885\ub8cc\uc2dc\uc810\uc744 \uc124\uc815\ud569\ub2c8\ub2e4.","egroup":"SPEED","etitle":"NaviSpeedEndingPoint(6s)","edescr":"Time until decel completes, based on speed x time","cgroup":"\u901f\u5ea6\u63a7\u5236","ctitle":"\u5bfc\u822a\u51cf\u901f\u7ed3\u675f\u70b9 (6\u79d2)","cdescr":"\u57fa\u4e8e \u901f\u5ea6 x \u65f6\u95f4 \u7684\u51cf\u901f\u5b8c\u6210\u65f6\u95f4","min":3,"max":20,"default":6,"unit":1,"display_unit":"timeSec"},{"group":"\uac10\uc18d\uc81c\uc5b4","name":"AutoNaviSpeedCtrlMode","title":"\ub124\ube44\uac8c\uc774\uc158\uac10\uc18d\ubaa8\ub4dc(2)","descr":"0: \uac10\uc18d\uc548\ud568\n1: \uacfc\uc18d\uce74\uba54\ub77c\n2: \uacfc\uc18d\uce74\uba54\ub77c+\uacfc\uc18d\ubc29\uc9c0\ud131\n3: \uacfc\uc18d\uce74\uba54\ub77c+\uacfc\uc18d\ubc29\uc9c0\ud131+\uc774\ub3d9\uc2dd\uce74\uba54\ub77c","egroup":"SPEED","etitle":"NaviSpeedControlMode(2)","edescr":"0: Not Use, 1: Speed cam, 2: cam + speed bump, 3: cam + bump + apn speed cam","cgroup":"\u901f\u5ea6\u63a7\u5236","ctitle":"\u5bfc\u822a\u51cf\u901f\u6a21\u5f0f (2)","cdescr":"0: \u4e0d\u4f7f\u7528, 1: \u9650\u901f\u6444\u50cf\u5934, 2: \u6444\u50cf\u5934 + \u51cf\u901f\u5e26, 3: \u6444\u50cf\u5934 + \u51cf\u901f\u5e26 + APN \u9650\u901f\u6444\u50cf\u5934","min":0,"max":3,"default":2,"unit":1},{"group":"\uac10\uc18d\uc81c\uc5b4","name":"VehicleNaviCanControl","title":"\ucc28\ub7c9 \ub0b4\ube44 CAN \uac10\uc18d \uc801\uc6a9 \ubaa8\ub4dc","descr":"\uc678\ubd80 \ub0b4\ube44\uac00 \uc5f0\uacb0\ub418\uc9c0 \uc54a\uc558\uc744 \ub54c\ub9cc \uc801\uc6a9\ud569\ub2c8\ub2e4. \uc678\ubd80 \ub0b4\ube44 \uc5f0\uacb0 \uc911\uc5d0\ub294 \uc548\ub0b4 \ud56d\ubaa9\uc774 \uc5c6\uc5b4\ub3c4 \uc21c\uc815 \ub0b4\ube44\ub97c \uc0ac\uc6a9\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \ucc28\ub7c9 \uc21c\uc815 \ub0b4\ube44 CAN\uc758 \uce74\uba54\ub77c\u00b7\ubc29\uc9c0\ud131 \uc2e4\uc81c \uac70\ub9ac\ub97c \uc790\ub3d9 \uac10\uc18d\uc5d0 \uc0ac\uc6a9\ud558\ub294 \ubc94\uc704\ub97c \uc120\ud0dd\ud569\ub2c8\ub2e4. \uacbd\ub85c \uc77c\uce58\ub294 vNAVI\uc758 \ud604\uc7ac \uacc4\uc0b0 \uacbd\ub85c\uc640 \ubbf8\ub798 \uc774\ubca4\ud2b8 \uacbd\ub85c\uac00 \uac19\ub2e4\ub294 \ub73b\uc785\ub2c8\ub2e4.\n0: \uc0ac\uc6a9 \uc548 \ud568\n1: \uce74\uba54\ub77c\u00b7\ubc29\uc9c0\ud131 \ud56d\uc0c1 \uc801\uc6a9\n2: \uce74\uba54\ub77c\ub294 \ud56d\uc0c1, \ubc29\uc9c0\ud131\uc740 \uacbd\ub85c \uc77c\uce58 \uc2dc \uc801\uc6a9\n3: \uce74\uba54\ub77c\u00b7\ubc29\uc9c0\ud131 \ubaa8\ub450 \uacbd\ub85c \uc77c\uce58 \uc2dc \uc801\uc6a9\n\uacbd\ub85c \uc815\ubcf4\uac00 2\ucd08 \ub118\uac8c \uac31\uc2e0\ub418\uc9c0 \uc54a\uc73c\uba74 \uacbd\ub85c \uc5c6\uc74c\uc73c\ub85c \ucc98\ub9ac\ud569\ub2c8\ub2e4. \ucc28\ub7c9\uc774 \ud604\uc7ac \uce74\uba54\ub77c \uc0c1\ud0dc\ub97c \uc9c1\uc811 \ud655\uc778\ud55c \uac10\uc18d\uc740 VehicleSpeedCameraControlMode\uac00 \ubcc4\ub3c4\ub85c \uc81c\uc5b4\ud569\ub2c8\ub2e4. PV5\uc758 \uc9c1\uc811 \ud655\uc778\ub41c \uad6c\uac04\ub2e8\uc18d \uc0c1\ud0dc\ub294 1~3\uc5d0\uc11c \uc720\uc9c0\ub429\ub2c8\ub2e4. \uc2e4\ud5d8 \uae30\ub2a5\uc774\ubbc0\ub85c \uac80\uc99d\ub41c \ucc28\ub7c9\uc5d0\uc11c\ub9cc \uc0ac\uc6a9\ud558\uc138\uc694. \ud604\uc7ac \uce74\uba54\ub77c \uacbd\uace0\uc5d0\ub294 \uac19\uc740 \uc81c\ud55c\uc18d\ub3c4\uc758 \uac00\uae4c\uc6b4 \uac70\ub9ac \ud6c4\ubcf4\ub9cc \uc5f0\uacb0\ud558\uba70, \uac19\uc740 \uc18d\ub3c4\uc758 \uba3c \uce74\uba54\ub77c\ub9cc \uc788\uc73c\uba74 \ud604\uc7ac \uacbd\uace0\uc758 \uac00\uc0c1\uac70\ub9ac\ub97c \uc0ac\uc6a9\ud569\ub2c8\ub2e4.","egroup":"SPEED","etitle":"Vehicle Navigation CAN Deceleration Mode","edescr":"Applies only when external navigation is disconnected. While external navigation is connected, stock navigation is excluded even without a current guidance item. Select when exact stock-navigation CAN camera and bump distances are used for deceleration. Route match means the vNAVI future event matches the currently calculated route and path.\n0: Disabled\n1: Always use cameras and bumps\n2: Always use cameras; use bumps only on the calculated route\n3: Use cameras and bumps only on the calculated route\nRoute data older than two seconds is treated as no route. Current camera states confirmed directly by the vehicle are controlled separately by VehicleSpeedCameraControlMode. A directly confirmed P a\u52a8\u51cf\u901f\u3002\u6b64\u8bbe\u7f6e\u4e0d\u5f71\u54cd\u4ece Carrot Navi \u63a5\u6536\u7684\u6d4b\u901f\u6444\u50cf\u5934\u4fe1\u606f\u3002\n0\uff1a\u7981\u7528\n1\uff1a\u65e0\u8bba\u52a0\u901f\u8e0f\u677f\u8f93\u5165\u5982\u4f55\u90fd\u59cb\u7ec8\u5e94\u7528\n2\uff1a\u8f66\u8f86\u63a5\u6536\u7684\u6444\u50cf\u5934\u51cf\u901f\u5f00\u59cb\u540e\uff0c\u65b0\u8e29\u4e0b\u52a0\u901f\u8e0f\u677f\u4f1a\u5ffd\u7565\u5f53\u524d\u4e8b\u4ef6\uff0c\u5e76\u5c06\u8986\u76d6\u671f\u95f4\u8fbe\u5230\u7684\u6700\u9ad8\u8f66\u901f\u4fdd\u6301\u4e3a\u51cf\u901f\u4e0b\u9650\n3\uff1a\u8e29\u4e0b\u52a0\u901f\u8e0f\u677f\u671f\u95f4\u6682\u505c\u8f66\u8f86\u63a5\u6536\u7684\u6d4b\u901f\u6444\u50cf\u5934\u51cf\u901f","min":0,"max":3,"default":1,"unit":1,"control":"select","options":{"ko":["\uc0ac\uc6a9 \uc548 \ud568","\ud56d\uc0c1 \uc801\uc6a9","\uac00\uc18d\ud398\ub2ec \uac10\uc18d \ubb34\uc2dc","\uac00\uc18d\ud398\ub2ec \uc785\ub825 \uc911 \ud574\uc81c"],"en":["Disabled","Always apply","Accelerator decel override","Suspend while accelerating"],"zh":["\u7981\u7528","\u59cb\u7ec8\u5e94\u7528","\u52a0\u901f\u8e0f\u677f\u5ffd\u7565\u51cf\u901f","\u52a0\u901f\u65f6\u6682\u505c"]}},{"group":"\uac10\uc18d\uc81c\uc5b4","name":"VehicleSpeedCameraDistanceTime","title":"\ucc28\ub7c9 \uacfc\uc18d\uce74\uba54\ub77c \uac00\uc0c1\uac70\ub9ac \uc2dc\uac04(6.0\ucd08)","descr":"\uc678\ubd80 \ub0b4\ube44\uac00 \uc5f0\uacb0\ub418\uc9c0 \uc54a\uc558\uc744 \ub54c\ub9cc \uc801\uc6a9\ud569\ub2c8\ub2e4. \uc678\ubd80 \ub0b4\ube44 \uc5f0\uacb0 \uc911\uc5d0\ub294 \uc548\ub0b4 \ud56d\ubaa9\uc774 \uc5c6\uc5b4\ub3c4 \uc21c\uc815 \ub0b4\ube44\ub97c \uc0ac\uc6a9\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \ucc28\ub7c9\uc774 \uacfc\uc18d\uce74\uba54\ub77c \uac70\ub9ac \uc5c6\uc774 \ub2e8\uc18d\uc18d\ub3c4\ub9cc \ubcf4\ub0bc \ub54c \uac00\uc0c1 \uac10\uc18d\uac70\ub9ac\ub97c \ub9cc\ub4ed\ub2c8\ub2e4. \uc800\uc7a5\uac12\uc740 0.1\ucd08 \ub2e8\uc704\uc774\uba70 60\uc740 6.0\ucd08, 62\ub294 6.2\ucd08\uc785\ub2c8\ub2e4. \uac00\uc0c1\uac70\ub9ac(m) = \ub2e8\uc18d\uc18d\ub3c4(km/h) \u00d7 \uc124\uc815\uc2dc\uac04(\ucd08)\uc73c\ub85c \uacc4\uc0b0\ud558\ubbc0\ub85c 50 km/h\uc5d0\uc11c 62\ub294 310 m\uc785\ub2c8\ub2e4. \uc124\uc815\uac12\uc774 \uc791\uc744\uc218\ub85d \uac00\uc0c1\uac70\ub9ac\uac00 \uc9e7\uc544\uc838 \uac10\uc18d\uc744 \ub354 \uc77c\ucc0d \ub610\ub294 \ub354 \uac15\ud558\uac8c \uc2dc\uc791\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \ubcc0\uacbd\uac12\uc740 \uc8fc\ud589 \uc911 \uc57d 1\ucd08 \uc774\ub0b4\uc5d0 \uc801\uc6a9\ub429\ub2c8\ub2e4. \uc9c0\uc6d0 CAN-FD \ucc28\ub7c9\uc5d0\uc11c \ud604\uc7ac \uacbd\uace0\uc640 \uc77c\uce58\ud558\ub294 \uac00\uae4c\uc6b4 \uac70\ub9ac\uac00 \uc5c6\uc744 \ub54c\ub3c4 \uc801\uc6a9\ud569\ub2c8\ub2e4. \uc0c8 \uacbd\uace0\ub098 \uc81c\ud55c\uc18d\ub3c4 \ubcc0\uacbd \uc2dc \ub2e4\uc2dc \uc2dc\uc791\ud558\uba70, \uac70\ub9ac\uac00 \uc18c\uc9c4\ub418\uc5b4\ub3c4 \uacbd\uace0\uac00 \uc720\uc9c0\ub418\ub294 \ub3d9\uc548\uc5d0\ub294 \uac10\uc18d \uc81c\ud55c\uc744 \uc720\uc9c0\ud558\uace0 \uac00\uc0c1\uac70\ub9ac\ub97c \ubc18\ubcf5 \uc5f0\uc7a5\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.","egroup":"SPEED","etitle":"Vehicle Speed Camera Virtual Distance Time (6.0 s)","edescr":"Applies only when external navigation is disconnected. While external navigation is connected, stock navigation is excluded even without a current guidance item. Creates a virtual deceleration distance when the vehicle sends only a speed-camera enforcement speed without distance. The stored value uses 0.1-second units: 60 means 6.0 s and 62 means 6.2 s. Virtual distance (m) = enforcement speed (km/h) \u00d7 configured time (s), so 62 produces 310 m at 50 km/h. A smaller value shortens the virtual distance, so deceleration may begin earlier or more strongly. Changes take effect within about one second while driving. Also applies on supported CAN-FD vehicles when no nearby distance matches the current warning. A new warning or limit change restarts the distance; once exhausted, the cap remains while the warning is active without repeatedly extending the virtual distance.","cgroup":"\u901f\u5ea6\u63a7\u5236","ctitle":"\u8f66\u8f86\u6d4b\u901f\u6444\u50cf\u5934\u865a\u62df\u8ddd\u79bb\u65f6\u95f4\uff086.0\u79d2\uff09","cdescr":"\u4ec5\u5728\u5916\u90e8\u5bfc\u822a\u672a\u8fde\u63a5\u65f6\u5e94\u7528\u3002\u5916\u90e8\u5bfc\u822a\u8fde\u63a5\u671f\u95f4\uff0c\u5373\u4f7f\u6ca1\u6709\u5f53\u524d\u5f15\u5bfc\u9879\u76ee\u4e5f\u4e0d\u4f7f\u7528\u539f\u8f66\u5bfc\u822a\u3002 \u5f53\u8f66\u8f86\u4ec5\u53d1\u9001\u6d4b\u901f\u6444\u50cf\u5934\u6267\u6cd5\u901f\u5ea6\u800c\u6ca1\u6709\u8ddd\u79bb\u65f6\uff0c\u521b\u5efa\u865a\u62df\u51cf\u901f\u8ddd\u79bb\u3002\u4fdd\u5b58\u503c\u4ee50.1\u79d2\u4e3a\u5355\u4f4d\uff1a60\u8868\u793a6.0\u79d2\uff0c62\u8868\u793a6.2\u79d2\u3002\u865a\u62df\u8ddd\u79bb\uff08\u7c73\uff09= \u6267\u6cd5\u901f\u5ea6\uff08km/h\uff09\u00d7 \u8bbe\u7f6e\u65f6\u95f4\uff08\u79d2\uff09\uff0c\u56e0\u6b64\u572850 km/h\u65f6\uff0c62\u4f1a\u751f\u6210310\u7c73\u3002\u8bbe\u7f6e\u503c\u8d8a\u5c0f\uff0c\u865a\u62df\u8ddd\u79bb\u8d8a\u77ed\uff0c\u56e0\u6b64\u53ef\u80fd\u4f1a\u66f4\u65e9\u6216\u66f4\u5f3a\u5730\u5f00\u59cb\u51cf\u901f\u3002\u66f4\u6539\u540e\u7684\u503c\u4f1a\u5728\u884c\u9a76\u4e2d\u7ea61\u79d2\u5185\u751f\u6548\u3002 \u652f\u6301\u7684CAN-FD\u8f66\u8f86\u5728\u6ca1\u6709\u4e0e\u5f53\u524d\u8b66\u544a\u5339\u914d\u7684\u8fd1\u5904\u8ddd\u79bb\u65f6\u4e5f\u9002\u7528\u3002\u65b0\u8b66\u544a\u6216\u9650\u901f\u53d8\u5316\u4f1a\u91cd\u65b0\u5f00\u59cb\u8ba1\u7b97\uff1b\u8ddd\u79bb\u8017\u5c3d\u540e\uff0c\u53ea\u8981\u8b66\u544a\u4ecd\u6709\u6548\u5c31\u4fdd\u6301\u9650\u901f\uff0c\u4e0d\u4f1a\u53cd\u590d\u5ef6\u957f\u865a\u62df\u8ddd\u79bb\u3002","min":10,"max":200,"default":60,"unit":1},{"group":"\uac10\uc18d\uc81c\uc5b4","name":"AutoRoadSpeedLimitOffset","title":"\ub3c4\ub85c\uc81c\ud55c\uc18d\ub3c4\ub9de\ucda4(-1)","descr":"\ub3c4\ub85c\uc81c\ud55c\uc18d\ub3c4 + \uc124\uc815\uac12\n -1: \uc548\ud568,","egroup":"SPEED","etitle":  \ubc29\uc9c0\ud131 \uc704\uce58\uac00 \uc2e4\uc81c \uc704\uce58\ubcf4\ub2e4 \ub4a4\uc5d0 \uc788\uc744 \ub54c \ud1b5\uacfc \ud6c4 \uc18d\ub3c4 \ubcf5\uc6d0\uc774 \ub2a6\ub294 \ud604\uc0c1\uc744 \ubcf4\uc815\ud569\ub2c8\ub2e4. \uac12\uc744 \ub108\ubb34 \ud06c\uac8c \uc124\uc815\ud558\uba74 \uc2e4\uc81c \ubc29\uc9c0\ud131 \uc804\uc5d0 \uac00\uc18d\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.","egroup":"SPEED","etitle":"Speed Bump Early Release Distance (200 cm)","edescr":"While external navigation is connected, release uses only its remaining distance; otherwise it uses stock-navigation distance. Release the speed-bump deceleration limit when the remaining distance from stock navigation or Carrot Navi is at or below this value. The stored and displayed unit is cm; 0 keeps control until the received point. This compensates when the mapped bump lies behind the physical bump and speed recovery otherwise starts late. Setting it too high can allow acceleration before the actual bump.","cgroup":"\u901f\u5ea6\u63a7\u5236","ctitle":"\u51cf\u901f\u5e26\u51cf\u901f\u63d0\u524d\u89e3\u9664\u8ddd\u79bb\uff08200\u5398\u7c73\uff09","cdescr":"\u5916\u90e8\u5bfc\u822a\u8fde\u63a5\u671f\u95f4\u4ec5\u6309\u5176\u5269\u4f59\u8ddd\u79bb\u89e3\u9664\u51cf\u901f\uff0c\u5426\u5219\u4f7f\u7528\u539f\u8f66\u5bfc\u822a\u8ddd\u79bb\u3002 \u5f53\u539f\u8f66\u5bfc\u822a\u6216 Carrot Navi \u63d0\u4f9b\u7684\u51cf\u901f\u5e26\u5269\u4f59\u8ddd\u79bb\u5c0f\u4e8e\u6216\u7b49\u4e8e\u6b64\u503c\u65f6\uff0c\u63d0\u524d\u89e3\u9664\u51cf\u901f\u9650\u5236\u3002\u4fdd\u5b58\u503c\u548c\u663e\u793a\u5355\u4f4d\u4e3a\u5398\u7c73\uff1b0 \u8868\u793a\u4fdd\u6301\u63a7\u5236\u76f4\u5230\u63a5\u6536\u7684\u4f4d\u7f6e\u3002\u6b64\u8bbe\u7f6e\u53ef\u8865\u507f\u5730\u56fe\u4e2d\u7684\u51cf\u901f\u5e26\u4f4d\u7f6e\u665a\u4e8e\u5b9e\u9645\u4f4d\u7f6e\u800c\u5bfc\u81f4\u901a\u8fc7\u540e\u6062\u590d\u901f\u5ea6\u8fc7\u6162\u7684\u95ee\u9898\u3002\u8bbe\u7f6e\u8fc7\u5927\u53ef\u80fd\u4f1a\u5728\u5b9e\u9645\u51cf\u901f\u5e26\u524d\u5f00\u59cb\u52a0\u901f\u3002","min":0,"max":5000,"default":200,"unit":10,"display_unit":"distanceCm","risk":"high"},{"group":"\uac10\uc18d\uc81c\uc5b4","name":"AutoNaviSpeedDecelRate","title":"\uacfc\uc18d\uce74\uba54\ub77c \uac10\uc18d\uc728 x0.01m/s^2(120)","descr":"\uce74\uba54\ub77c\u00b7\ubc29\uc9c0\ud131 \uc811\uadfc \uc2dc \uac10\uc18d \uace1\uc120 \uacc4\uc0b0\uc5d0 \uc0ac\uc6a9\ud558\ub294 \uac12\uc785\ub2c8\ub2e4. \uc800\uc7a5\uac12\uc5d0 0.01m/s\u00b2\ub97c \uacf1\ud558\uba70 120\uc740 1.2m/s\u00b2\uc785\ub2c8\ub2e4. \ub0ae\ucd94\uba74 \ub354 \uba3c \uac70\ub9ac\uc5d0\uc11c \uac10\uc18d\uc744 \uc2dc\uc791\ud558\uace0, \ub192\uc774\uba74 \ub354 \uac00\uae4c\uc774\uc11c \uc2dc\uc791\ud569\ub2c8\ub2e4. \uae30\uc874\uc5d0 \uc800\uc7a5\ub41c \uc124\uc815\uc740 \uc5c5\ub370\uc774\ud2b8\ub9cc\uc73c\ub85c \ubc14\ub00c\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.","egroup":"SPEED","etitle":"NaviSpeedDecelRate 0.01m/s^2x(120)","edescr":"Used to calculate the deceleration curve when approaching cameras and speed bumps. The stored value is multiplied by 0.01 m/s\u00b2, so 120 means 1.2 m/s\u00b2. Lower values start slowing farther away; higher values start closer. Updating the software does not change an existing saved setting.","cgroup":"\u901f\u5ea6\u63a7\u5236","ctitle":"\u5bfc\u822a\u51cf\u901f\u6548\u7387 0.01m/s^2x(120)","cdescr":"\u7528\u4e8e\u8ba1\u7b97\u63a5\u8fd1\u6444\u50cf\u5934\u548c\u51cf\u901f\u5e26\u65f6\u7684\u51cf\u901f\u66f2\u7ebf\u3002\u5b58\u50a8\u503c\u4e58\u4ee5 0.01 m/s\u00b2\uff0c120 \u8868\u793a 1.2 m/s\u00b2\u3002\u6570\u503c\u8d8a\u4f4e\uff0c\u5f00\u59cb\u51cf\u901f\u7684\u8ddd\u79bb\u8d8a\u8fdc\uff1b\u6570\u503c\u8d8a\u9ad8\uff0c\u5f00\u59cb\u51cf\u901f\u7684\u8ddd\u79bb\u8d8a\u8fd1\u3002\u8f6f\u4ef6\u66f4\u65b0\u4e0d\u4f1a\u66f4\u6539\u5df2\u4fdd\u5b58\u7684\u8bbe\u7f6e\u3002","min":50,"max":300,"default":120,"unit":10},{"group":"\uac10\uc18d\uc81c\uc5b4","name":"AutoNaviCountDownMode","title":"\ub124\ube44\uc54c\ub9bc \uce74\uc6b4\ud2b8\ub2e function navSnapshot(){return {tab:state.tab,stage:state.stage,category:state.category,group:state.group,lastStage:state.lastStage,search:state.search,modal:state.modal,maker:state.maker,pendingCar:state.pendingCar,choiceName:state.choice?.name||null,updateOpen:!document.getElementById('updateOverlay').hidden};}
function recordNav(replace=false){if(!navigationHistoryReady)return;try{const entry={app:NAV_MARK,version:DEMO_VERSION,nav:navSnapshot()};if(replace)history.replaceState(entry,'',location.href);else history.pushState(entry,'',location.href);}catch{navigationHistoryReady=false;}}
function restoreNav(snapshot){if(!snapshot||typeof snapshot!=='object')return;const tabs=['settings','tools','drive','logs','terminal'],stages=['categories','groups','items','search'];state.tab=tabs.includes(snapshot.tab)?snapshot.tab:'settings';state.stage=stages.includes(snapshot.stage)?snapshot.stage:'categories';state.category=typeof snapshot.category==='string'?snapshot.category:null;state.group=typeof snapshot.group==='string'?snapshot.group:null;state.lastStage=stages.includes(snapshot.lastStage)?snapshot.lastStage:'categories';state.search=typeof snapshot.search==='string'?snapshot.search:'';state.modal=['makers','models','confirm'].includes(snapshot.modal)?snapshot.modal:null;state.maker=typeof snapshot.maker==='string'&&Object.hasOwn(CAR_CATALOG,snapshot.maker)?snapshot.maker:null;state.pendingCar=typeof snapshot.pendingCar==='string'?snapshot.pendingCar:null;state.choice=null;state.fab=false;$('choiceOverlay').hidden=true;$('updateOverlay').hidden=true;document.body.style.overflow='';render();if(snapshot.choiceName&&BY_NAME.has(snapshot.choiceName))openChoice(snapshot.choiceName,false);if(snapshot.updateOpen&&updateState.assetUrl)renderUpdateDialog(false);window.scrollTo(0,0);}
function initNavHistory(){const entry=history.state;if(entry?.app===NAV_MARK&&entry.version===DEMO_VERSION&&entry.nav)restoreNav(entry.nav);else recordNav(true);window.addEventListener('popstate',event=>{const next=event.state;if(next?.app===NAV_MARK&&next.version===DEMO_VERSION&&next.nav)restoreNav(next.nav);});}
const updateState={status:'확인 전',latest:null,releaseUrl:null,assetUrl:null,checking:false};
const $=id=>document.getElementById(id);
const own=(obj,key)=>Object.prototype.hasOwnProperty.call(obj,key);
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const attr=esc;
const carNames=new Set(Object.values(CAR_CATALOG).flat());
const unitLabels={raw:'',speedKph:'km/h',distanceCm:'cm',timeSec:'s',timeMs:'ms',timeMin:'min',percent:'%',degree:'deg'};
function defaultBackup(){return Object.fromEntries(PARAMS.map(p=>[p.name,String(p.default)]));}
function shown(p){return own(state.backup,p.name)?state.backup[p.name]:p.default;}
function booleanBackupValue(p){if(p.min!==0||p.max!==1)return null;const raw=shown(p);if(typeof raw!=='string')return null;const text=raw.trim().toLowerCase();return text==='true'?1:text==='false'?0:null;}
function controlValue(p){return booleanBackupValue(p)??shown(p);}
function displayValue(value){return value!==null&&typeof value==='object'?JSON.stringify(value):String(value??'');}
function toast(message,error=false){const el=$('toast');el.textContent=message;el.style.borderColor=error?'#aa6262':'#6a574b';el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,9000);}
function currentCar(){const selected=String(state.backup.CarSelected3??'').trim();if(selected)return {name:selected,key:'CarSelected3'};const effective=String(state.backup.CarName??'').trim();return {name:effective,key:effective?'CarName':null};}
function paramPath(name){function seek(node,path){if((node.params||[]).includes(name))return [...path,node];for(const child of node.groups||[]){const found=seek(child,[...path,node]);if(found)return found;}return null;}for(const category of SCHEMA.menu){const found=seek(category,[]);if(found)return found;}return [];}
function flatten(group){const result=[];function walk(node,parents){if(node.params?.length)result.push({title:parents.length?node.ko:null,names:node.params});for(const child of node.groups||[])walk(child,[...parents,node]);}walk(group,[]);return result;}
function groupCount(group){return flatten(group).reduce((n,x)=>n+x.names.filter(key=>BY_NAME.has(key)).length,0);}
function navigate(stage,category=null,group=null){state.stage=stage;state.category=category;state.group=group;state.tab='settings';state.fab=false;render();recordNav();window.scrollTo(0,0);}
function back(){if(navigationHistoryReady){history.back();return;}if(state.choice){state.choice=null;$('choiceOverlay').hidden=true;return;}if(state.modal==='confirm'){state.modal='models';renderModal();return;}if(state.modal==='models'){state.modal='makers';renderModal();return;}if(state.modal){state.modal=null;renderModal();return;}if(state.tab!=='settings'){state.tab='settings';render();return;}if(state.stage==='items')navigate('groups',state.category);else if(state.stage==='groups')navigate('categories');else if(state.stage==='search')navigate(state.lastStage||'categories',state.category,state.group);else history.back();}
function titleForStage(){if(state.tab==='tools')return '도구';if(state.tab==='drive')return '주행';if(state.tab==='logs')return '로그';if(state.tab==='terminal')return '터미널';if(state.stage==='search')return '검색 결과';if(state.stage==='groups')return SCHEMA.menu.find(x=>x.id===state.category)?.ko||'설정';if(state.stage==='items')return SCHEMA.menu.find(x=>x.id===state.category)?.groups?.find(x=>x.id===state.group)?.ko||'설정';return '설정';}
function listRow(title,note,action,badge=''){return `<button class="list-button" type="button" data-action="${attr(action)}"><span><strong>${esc(title)}</strong>${note?`<small>${esc(note)}</small>`:''}</span>${badge?`<span class="count-badge">${esc(badge)}</span>`:'<span class="chevron" aria-hidden="true">›</span>'}</button>`;}
function searchBox(value,placeholder,count){return `<div class="searchbox"><div class="searchline"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" d="M16 16l5 5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0"/></svg><input id="searchInput" type="search" aria-label="설정 검색" placeholder="${esc(placeholder)}" value="${attr(value)}"><button class="clear" type="button" data-action="clearSearch" aria-label="검색어 지우기" ${value?'':'hidden'}>×</button></div>${count!==undefined?`<span class="searchcount">전체 ${count}개 중 ${count}개</span>`:''}</div>`;}
function matches(p,q){const path=paramPath(p.name).map(x=>x.ko).join(' ');return [p.name,p.title,p.descr,p.etitle,p.edescr,path].some(x=>String(x||'').toLocaleLowerCase().includes(q));}
function foundParams(){const q=state.search.trim().toLocaleLowerCase();return q?PARAMS.filter(p=>matches(p,q)):[];}
function settingControl(p){const value=controlValue(p);if(p.name==='SoundLanguageSetting')return `<button class="select-value" type="button" data-choice="${attr(p.name)}" aria-label="${attr(p.title)}">${esc(({auto:'자동',en:'English',ko:'한국어','zh-CHS':'中文'})[value]||value)}</button>`;const number=Number(value),valid=typeof value!=='object'&&value!==null&&Number.isInteger(number)&&number>=p.min&&number<=p.max;const range=p.max-p.min+1;let kind=p.control;if(!kind){if(p.min===0&&p.max===1)kind='toggle';else if(Number.isInteger(range)&&range>=2&&range<=4)kind='segmented';else if(Number.isInteger(range)&&range>=5&&range<=8)kind='select';else kind='value';}if(kind==='slider')kind='value';if(!valid){return `<input class="raw-input" data-raw="${attr(p.name)}" aria-label="${attr(p.title)} 값" value="${attr(displayValue(value))}">`;}
 if(kind==='toggle'&&p.min===0&&p.max===1)return `<button class="switch ${number===1?'on':''}" type="button" role="switch" aria-checked="${number===1}" aria-label="${attr(p.title)}" data-set="${attr(p.name)}" data-value="${number===1?0:1}"></button>`;
 if(kind==='segmented'&&range>=2&&range<=8){let opts='';for(let i=p.min;i<=p.max;i++)opts+=`<button type="button" class="${i===number?'active':''}" data-set="${attr(p.name)}" data-value="${i}" aria-label="${attr(p.title)} ${i}" aria-pressed="${i===number}">${i}</button>`;return `<div class="segments" role="group" aria-label="${attr(p.title)}">${opts}</div>`;}
 if(kind==='select'&&range>=2&&range<=32)return `<button class="select-value" type="button" data-choice="${attr(p.name)}" aria-label="${attr(p.title)}">${number}</button>`;
 const step=Math.max(1,Number(p.unit)||1)*Math.max(1,state.multiplier.get(p.name)||1);return `<div class="stepper" role="group" aria-label="${attr(p.title)}"><button type="button" data-step="${attr(p.name)}" data-delta="-${step}" aria-label="${attr(p.title)} 감소">−</button><button type="button" class="value" data-edit="${attr(p.name)}" aria-label="${attr(p.title)} 값 직접 입력">${esc(number)}</button><button type="button" data-step="${attr(p.name)}" data-delta="${step}" aria-label="${attr(p.title)} 증가">+</button></div>`;
}
function settingCard(p){const unit=unitLabels[p.display_unit]??p.display_unit??'';const minmax=Number.isFinite(p.min)&&Number.isFinite(p.max)?`min=${p.min}, max=${p.max}, default=${p.default}`:`default=${p.default}`;const needsMultiplier=(p.max-p.min)>=20&&p.control!=='toggle'&&p.control!=='segmented'&&p.control!=='select';const mult=state.multiplier.get(p.name)||1;const risk=p.risk==='high'?'<span class="risk">주의</span>':p.risk==='medium'?'<span class="risk medium">참고</span>':'';const unavailable='내 차종 인기값: 오프라인';const booleanValue=booleanBackupValue(p);const booleanHint=booleanValue===null?'':`<div class="hint">백업 원본 ${esc(shown(p))} → 화면에는 ${booleanValue}으로 표시 · 값을 바꾸기 전까지 원본 유지</div>`;return `<article class="setting" data-param="${attr(p.name)}"><div class="setting-top"><div class="setting-copy"><div class="setting-title" title="${attr(p.title)}">${esc(p.title)} ${risk}</div><div class="setting-key">${esc(p.name)}</div></div><div class="control">${settingControl(p)}</div></div><div class="setting-meta">${esc(minmax)}${unit?` <span class="unit">${esc(unit)}</span>`:''}</div><p class="setting-descr">${esc(p.descr||'')}</p><div class="setting-actions"><span class="offline-popular">${unavailable}</span>${needsMultiplier?`<button class="small-btn" type="button" data-mult="${attr(p.name)}">x${mult}</button>`:''}<button class="small-btn" type="button" data-default="${attr(p.name)}">기본값</button></div>${booleanHint}${own(state.backup,p.name)?'':'<div class="hint">백업에 없는 항목: 기본값 표시 중</div>'}</article>`;}
function coastingHelp(){return `<details class="setting-extra"><summary>원본 WIP 사용 안내</summary><p>0%는 기존 제어를 유지합니다. 설정속도와 MPC 목표속도를 높이지 않고, SCC를 끄거나 양의 가속 명령을 추가하지 않습니다.</p><p>예: 설정속도 100 km/h, 여유 5%이면 100~105 km/h 구간에서 크루즈 감속을 완화합니다. 105 km/h까지 가속시키는 기능은 아닙니다. 구간 처음 10%에서는 완화가 증가하고 마지막 40%에서는 일반 감속으로 돌아갑니다. 이 상한은 실제 속도의 절대 상한을 보장하지 않습니다.</p><p>오픈파일럿 종방향 제어의 일반 크루즈에서 조건이 1초 이상 안정되고 기준속도가 10 km/h를 넘을 때 적용됩니다. 앞차, 정지, 커브, ATC, 차선 변경, 실험모드, 외부 속도제어 또는 운전자 페달 개입 시에는 일반 제어를 우선합니다.</p></details>`;}
function sectionCard(names,title){const rows=names.map(n=>BY_NAME.get(n)).filter(Boolean).map(p=>{const card=settingCard(p);return p.name==='CruiseCoastingPercent'?card.replace('</article>',coastingHelp()+'</article>'):card;}).join('');return rows?`${title?`<h2 class="section-title">${esc(title)}</h2>`:''}<div class="group-card">${rows}</div>`:'';}
function renderSettings(){if(state.stage==='categories'){const cats=SCHEMA.menu.map(c=>listRow(c.ko,`${groupCount(c)}개 설정`,`cat:${c.id}`)).join('');return `<div class="view">${searchBox('','예: 감속, TF')}<div class="tabbar"><button class="active" type="button">당근파일럿</button><button type="button" data-action="deviceInfo">디바이스</button></div><div class="list">${listRow('차량 선택',currentCar().name||'차량을 선택하세요','car')}${cats}</div></div>`;}
if(state.stage==='groups'){const c=SCHEMA.menu.find(x=>x.id===state.category);if(!c)return '';return `<div class="view"><p class="subnote">${esc(c.ko)} 설정 그룹</p><div class="list">${(c.groups||[]).map(g=>listRow(g.ko,`${groupCount(g)}개 설정`,`group:${g.id}`)).join('')}</div></div>`;}
if(state.stage==='items'){const g=SCHEMA.menu.find(x=>x.id===state.category)?.groups?.find(x=>x.id===state.group);if(!g)return '';return `<div class="view">${flatten(g).map(s=>sectionCard(s.names,s.title)).join('')}</div>`;}
if(state.stage==='search'){const found=foundParams();const groupMap=new Map();for(const p of found){const path=paramPath(p.name),label=path.at(-1)?.ko||'기타';if(!groupMap.has(label))groupMap.set(label,[]);groupMap.get(label).push(p.name);}const sections=[...groupMap].map(([label,names])=>sectionCard(names,label)).join('');return `<div class="view">${searchBox(state.search,'설정 검색',found.length)}${found.length?sections:'<div class="empty">설정 이름, 키 또는 설명을 검색하세요.</div>'}</div>`;}
return '';
}
function stableVersion(value){const match=/^v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(String(value||''));if(!match)return null;const parts=match.slice(1).map(Number);return parts.every(Number.isSafeInteger)?parts:null;}
function compareVersions(left,right){const a=stableVersion(left),b=stableVersion(right);if(!a||!b)return null;for(let i=0;i<3;i++){if(a[i]!==b[i])return a[i]>b[i]?1:-1;}return 0;}
function isPublishedAsset(url,tag){try{const parsed=new URL(url);return parsed.origin==='https://github.com'&&parsed.pathname===`/${UPDATE_REPO}/releases/download/${encodeURIComponent(tag)}/${UPDATE_ASSET}`;}catch{return false;}}
function isHostedDemo(){return location.origin==='https://fullmetalsonic.github.io'&&['/webcarrot-offline-demo/','/webcarrot-offline-demo/index.html','/webcarrot-offline-demo/webcarrot-offline-demo.html'].includes(location.pathname);}
async function checkForUpdate(manual=false){if(updateState.checking)return;updateState.checking=true;updateState.status='GitHub에서 최신 정식 버전을 확인 중입니다…';if(state.tab==='tools')render();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);try{const response=await fetch(`https://api.github.com/repos/${UPDATE_REPO}/releases/latest`,{headers:{Accept:'application/vnd.github+json'},cache:'no-store',signal:controller.signal});if(!response.ok)throw new Error(response.status===404?'아직 공개된 정식 Release가 없습니다.':response.status===403?'GitHub 요청 제한으로 확인할 수 없습니다.':`GitHub 응답 ${response.status}`);const release=await response.json();const tag=String(release.tag_name||'');if(release.draft||release.prerelease||!stableVersion(tag))throw new Error('정식 버전 정보를 확인할 수 없습니다.');updateState.latest=tag;updateState.releaseUrl=`https://github.com/${UPDATE_REPO}/releases/tag/${encodeURIComponent(tag)}`;const comparison=compareVersions(tag,DEMO_VERSION);if(comparison>0){const asset=(release.assets||[]).find(item=>item.name===UPDATE_ASSET&&isPublishedAsset(item.browser_download_url,tag));updateState.assetUrl=asset?asset.browser_download_url:null;updateState.status=asset?'새 버전이 있습니다. 업데이트하면 화면과 설정 메뉴가 함께 바뀝니다.':'새 버전이 있지만 HTML 파일이 아직 첨부되지 않았습니다.';if(asset&&!manual)toast(`새 데모 버전 ${tag}이 있습니다. 도구에서 업데이트할 수 있습니다.`);}else{updateState.assetUrl=null;updateState.status=comparison===0?'최신 버전입니다.':'현재 버전이 GitHub 정식 버전보다 높습니다.';if(manual)toast(updateState.status);}}catch(error){updateState.assetUrl=null;updateState.status=error.name==='AbortError'?'확인 시간이 초과되었습니다. 현재 데모는 계속 사용할 수 있습니다.':`업데이트 확인 불가: ${error.message} 현재 데모는 계속 사용할 수 있습니다.`;if(manual)toast(updateState.status,true);}finally{clearTimeout(timer);updateState.checking=false;if(state.tab==='tools')render();}}
function renderUpdateDialog(record=true){if(!updateState.assetUrl)return;const hosted=isHostedDemo();$('updateSubtitle').textContent=`현재 ${DEMO_VERSION} → 최신 ${updateState.latest}`;$('updateBody').innerHTML=hosted?'<p>현재 설정값을 이 브라우저에 임시 보관하고 최신 데모 화면을 엽니다. 새 버전이 게시되기 전이면 잠시 뒤 다시 시도하세요.</p><button class="primary" type="button" data-action="applyHostedUpdate">설정 보관 후 새 버전 열기</button><button type="button" data-action="export">백업 JSON도 내보내기</button>':'<p>다운로드한 HTML 파일은 스스로 덮어쓸 수 없습니다. 먼저 현재 설정을 JSON 백업으로 저장한 뒤 새 HTML을 다운로드하세요. 새 버전에서 JSON을 불러오면 같은 설정으로 계속 작업할 수 있습니다.</p><button type="button" data-action="saveUpdateBackup">1. 현재 설정 JSON 백업</button><button class="primary" type="button" data-action="downloadUpdate" disabled>2. 새 HTML 다운로드</button>';$('updateOverlay').hidden=false;document.body.style.overflow='hidden';if(record)recordNav();}
function closeUpdateDialog(){if(navigationHistoryReady){history.back();return;}$('updateOverlay').hidden=true;document.body.style.overflow=state.modal?'hidden':'';}
function applyHostedUpdate(){if(!updateState.assetUrl||!isHostedDemo())return;try{localStorage.setItem(UPDATE_BACKUP_KEY,JSON.stringify({target:updateState.latest,backup:state.backup}));}catch{toast('브라우저에 설정을 보관하지 못했습니다. JSON 백업을 먼저 내보내세요.',true);return;}const next=new URL(UPDATE_PAGES_URL);next.searchParams.set('version',updateState.latest);location.assign(next.href);}
function restorePendingUpdate(){if(!isHostedDemo())return;let raw;try{raw=localStorage.getItem(UPDATE_BACKUP_KEY);}catch{return;}if(!raw)return;try{const saved=JSON.parse(raw);if(!saved||!saved.backup||typeof saved.backup!=='object'||Array.isArray(saved.backup)||!stableVersion(saved.target))throw new Error('invalid');state.backup=saved.backup;state.imported=true;if(compareVersions(DEMO_VERSION,saved.target)<0){toast(`설정을 복원했습니다. GitHub Pages에 ${saved.target} 배포가 아직 반영되지 않아 보관본도 유지합니다.`);return;}localStorage.removeItem(UPDATE_BACKUP_KEY);toast(`데모 ${DEMO_VERSION}에서 이전 설정 ${Object.keys(state.backup).length}개를 복원했습니다.`);}catch{toast('보관된 설정을 확인하지 못했습니다. 이전 JSON 백업을 불러오세요.',true);}}
function syncPendingUpdateBackup(){if(!isHostedDemo())return;try{const raw=localStorage.getItem(UPDATE_BACKUP_KEY);if(!raw)return;const saved=JSON.parse(raw);if(stableVersion(saved.target)&&compareVersions(DEMO_VERSION,saved.target)<0)localStorage.setItem(UPDATE_BACKUP_KEY,JSON.stringify({target:saved.target,backup:state.backup}));}catch{}}
function renderTools(){const newest=updateState.latest?esc(updateState.latest):'확인 전';const updateButton=updateState.assetUrl?'<button type="button" data-action="updateDemo">업데이트하기</button>':'';const releaseLink=updateState.releaseUrl?`<a href="${attr(updateState.releaseUrl)}" target="_blank" rel="noopener noreferrer">GitHub 최신 버전 보기</a>`:'';return `<section class="tool-panel"><h2>파라미터 백업</h2><p>설정값을 데모에서 편집한 뒤 JSON 파일로 내보낼 수 있습니다. 가져온 파일의 목록 밖 항목과 값 형식은 그대로 보존합니다.</p><button type="button" data-action="import">JSON 백업 불러오기</button><button type="button" data-action="export">백업 JSON 내보내기</button><button type="button" data-action="new">새 데모 시작</button><p>기준: ajouatom/openpilot carrot-wip ${SOURCE_SHA.slice(0,8)} · 설정 ${PARAMS.length}개<br>내보낸 파일을 콤마에서 복원한 뒤 재시작해야 실제 차량 선택에 반영됩니다.</p></section><section class="tool-panel" aria-label="데모 업데이트"><h2>데모 업데이트</h2><p>현재 버전 ${esc(DEMO_VERSION)} · 최신 버전 ${newest}<br>원본 WIP ${esc(SOURCE_SHA.slice(0,8))}<br>${esc(updateState.status)}</p><button type="button" data-action="checkUpdate" ${updateState.checking?'disabled':''}>${updateState.checking?'확인 중…':'업데이트 확인'}</button>${updateButton}${releaseLink?`<p>${releaseLink}</p>`:''}<p>새 버전은 데모 화면과 설정 메뉴 전체가 함께 갱신됩니다. 인터넷 연결이 없어도 현재 데모는 계속 사용할 수 있습니다.</p></section>`;}
function render(){const title=titleForStage();$('pageTitle').textContent=title;$('pageTitle').title=title;$('backBtn').hidden=state.tab==='settings'&&state.stage==='categories';$('screen').innerHTML=state.tab==='settings'?renderSettings():state.tab==='tools'?renderTools():`<div class="empty">오프라인 데모에서는 설정과 백업 도구를 사용할 수 있습니다.</div>`;for(const btn of document.querySelectorAll('.bottom-nav button'))btn.classList.toggle('active',btn.dataset.tab===state.tab);$('fab').hidden=state.tab!=='settings';$('fabActions').hidden=!state.fab||state.tab!=='settings';$('fab').setAttribute('aria-expanded',String(state.fab));renderModal();}
function openSearch(){if(state.stage!=='search')state.lastStage=state.stage;state.stage='search';state.search='';state.fab=false;render();recordNav();$('searchInput')?.focus();window.scrollTo(0,0);}
function updateSearch(text){const entering=state.stage!=='search';if(entering)state.lastStage=state.stage;state.search=text;state.stage='search';const input=$('searchInput');const start=input?.selectionStart??text.length;const end=input?.selectionEnd??text.length;const y=window.scrollY;render();recordNav(!entering);const next=$('searchInput');next?.focus();try{next?.setSelectionRange(start,end);}catch{}window.scrollTo(0,y);}
function setParam(name,value){const p=BY_NAME.get(name);if(!p)return;if(name==='SoundLanguageSetting'){if(!['auto','en','ko','zh-CHS'].includes(String(value))){toast('지원하는 언어를 선택하세요.',true);return;}state.backup[name]=String(value);state.dirty.add(name);render();toast(`${p.title} 저장됨`);return;}const n=Number(value);if(!Number.isInteger(n)||n<p.min||n>p.max){toast(`${p.title}: ${p.min}~${p.max} 사이의 정수를 입력하세요.`,true);return;}state.backup[name]=String(n);state.dirty.add(name);render();toast(`${p.title} ${n}${unitLabels[p.display_unit]||''} 저장됨`);}
function editRaw(name,text){const p=BY_NAME.get(name);if(!p)return;const n=Number(text);if(String(text).trim()===''||!Number.isInteger(n)||n<p.min||n>p.max){toast(`${p.title}: ${p.min}~${p.max} 사이의 정수를 입력하세요.`,true);render();return;}setParam(name,n);}
function chooseCar(name){state.pendingCar=name;state.modal='confirm';renderModal();recordNav();}
function dismissCarPicker(){const depth=state.modal==='confirm'?3:state.modal==='models'?2:state.modal==='makers'?1:0;if(depth&&navigationHistoryReady){history.go(-depth);return;}state.modal=null;state.pendingCar=null;renderModal();}
function commitCar(){const name=state.pendingCar;if(!name)return;state.backup.CarSelected3=name;state.dirty.add('CarSelected3');dismissCarPicker();toast(`${name} 선택됨. 내보낸 파일을 콤마에서 복원한 뒤 재시작해야 실제 차량 선택에 반영됩니다.${name.startsWith('Tesla Model X ')?' 원본 WIP는 Model X를 강제 차량 후보로 사용하지 않습니다.':''}`);}
function openCar(){state.maker=null;state.modal='makers';renderModal();recordNav();}
function renderModal(){const modal=$('carModal');if(!state.modal){modal.hidden=true;document.body.style.overflow='';return;}modal.hidden=false;document.body.style.overflow='hidden';const car=currentCar();const isModels=state.modal==='models'||state.modal==='confirm';$('modalTitle').textContent=isModels?state.maker||'차량 선택':'차량 선택';const caveat=car.name&&!carNames.has(car.name)?' · 내장 목록 밖 백업값 유지':car.name.startsWith('Tesla Model X ')?' · WIP 강제 차량 후보에서 제외':'';$('modalSubtitle').textContent=(car.name||'선택된 차량 없음')+caveat;const makers=Object.keys(CAR_CATALOG).sort((a,b)=>a.localeCompare(b));const list=isModels?(CAR_CATALOG[state.maker]||[]).map((name,index)=>listRow(name.startsWith(state.maker+' ')?name.slice(state.maker.length+1):name,'',`model:${index}`)).join(''):makers.map((m,index)=>listRow(m,'',`maker:${index}`,CAR_CATALOG[m].length)).join('');$('modalList').innerHTML=list;$('modalCancel').textContent=isModels?'이전':'취소';$('carConfirm').hidden=state.modal!=='confirm';$('confirmCarName').textContent=state.pendingCar||'';}
function openChoice(name,record=true){const p=BY_NAME.get(name);if(!p)return;const stringChoice=name==='SoundLanguageSetting';const range=p.max-p.min+1;const select=stringChoice||p.control==='select'||(!p.control&&Number.isInteger(range)&&range>4&&range<=8);state.choice={name,value:controlValue(p),select};$('choiceTitle').textContent=p.title;$('choiceHint').textContent=stringChoice?'원본 WIP의 언어 선택지':`min=${p.min}, max=${p.max}, default=${p.default}`;if(select){const choices=stringChoice?[['auto','자동'],['en','English'],['ko','한국어'],['zh-CHS','中文']]:Array.from({length:range},(_,i)=>{const value=p.min+i;return [value,p.options?.ko?.[i]||String(value)];});$('choiceBody').innerHTML=choices.map(([value,label])=>`<button type="button" class="${String(value)===String(state.choice.value)?'active':''}" data-choice-value="${attr(value)}">${esc(value)}${String(label)===String(value)?'':` · ${esc(label)}`}</button>`).join('');}else{$('choiceBody').innerHTML=`<input id="choiceNumber" type="number" min="${attr(p.min)}" max="${attr(p.max)}" step="${attr(Math.max(1,Number(p.unit)||1))}" value="${attr(displayValue(controlValue(p)))}" aria-label="설정값"><input id="choiceRange" type="range" min="${attr(p.min)}" max="${attr(p.max)}" step="${attr(Math.max(1,Number(p.unit)||1))}" value="${attr(displayValue(controlValue(p)))}" aria-label="설정값 범위">`;}$('choiceOverlay').hidden=false;if(record)recordNav();($('choiceNumber')||$('choiceBody').querySelector('.active')||$('choiceBody').querySelector('button'))?.focus();}
function closeChoice(){if(navigationHistoryReady){history.back();return;}state.choice=null;$('choiceOverlay').hidden=true;}
function applyChoice(){if(!state.choice)return;const {name,select}=state.choice;const value=select?state.choice.value:$('choiceNumber').value;if(value===''||value===null||value===undefined){toast('값을 입력하세요.',true);return;}const p=BY_NAME.get(name);if(name!=='SoundLanguageSetting'&&(!Number.isInteger(Number(value))||Number(value)<p.min||Number(value)>p.max)){toast(`${p.title}: ${p.min}~${p.max} 사이의 정수를 입력하세요.`,true);return;}setParam(name,value);closeChoice();}
async function importBackup(file){let parsed;try{parsed=JSON.parse(await file.text());}catch{throw new Error('JSON 문법을 확인하세요.');}if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))throw new Error('최상위가 파라미터 이름과 값으로 이루어진 JSON 객체여야 합니다.');state.backup=parsed;state.imported=true;state.dirty.clear();render();const unknown=Object.keys(parsed).filter(k=>!BY_NAME.has(k)).length;toast(`${file.name} 불러옴 · 총 ${Object.keys(parsed).length}개, WIP 목록 밖 ${unknown}개. 원본 항목은 유지됩니다.`);}
function exportBackup(){const json=JSON.stringify(state.backup,null,2)+'\n';const url=URL.createObjectURL(new Blob([json],{type:'application/json;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=`params_backup_webcarrot_demo_${new Date().toISOString().slice(0,10)}.json`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast(`백업 JSON 내보냄 · ${Object.keys(state.backup).length}개 항목 · 수정 ${state.dirty.size}개`);}
function newDemo(){if(state.imported||state.dirty.size){if(!confirm('현재 데모 값을 새 기본값으로 바꾸시겠습니까? 가져온 백업 파일 자체는 변경되지 않습니다.'))return;}state.backup=defaultBackup();state.imported=false;state.dirty.clear();state.multiplier.clear();state.stage='categories';state.tab='settings';state.search='';render();recordNav(true);toast('새 데모를 시작했습니다.');}
function handleAction(action){if(action.startsWith('cat:'))navigate('groups',action.slice(4));else if(action.startsWith('group:'))navigate('items',state.category,action.slice(6));else if(action.startsWith('maker:')){state.maker=Object.keys(CAR_CATALOG).sort((a,b)=>a.localeCompare(b))[Number(action.slice(6))];state.modal='models';renderModal();recordNav();}else if(action.startsWith('model:'))chooseCar((CAR_CATALOG[state.maker]||[])[Number(action.slice(6))]);else if(action==='car')openCar();else if(action==='search')openSearch();else if(action==='clearSearch'){if(state.stage==='search'){state.search='';render();recordNav(true);$('searchInput')?.focus();}else {$('searchInput').value='';}}else if(action==='import')$('fileInput').click();else if(action==='export')exportBackup();else if(action==='new')newDemo();else if(action==='deviceInfo')toast('기기 연결이 없는 데모에서는 디바이스 설정을 읽을 수 없습니다.');else if(action==='checkUpdate')checkForUpdate(true);else if(action==='updateDemo')renderUpdateDialog();else if(action==='closeUpdate')closeUpdateDialog();else if(action==='applyHostedUpdate')applyHostedUpdate();else if(action==='saveUpdateBackup'){exportBackup();$('updateBody').querySelector('[data-action="downloadUpdate"]').disabled=false;}else if(action==='downloadUpdate'){if(!updateState.assetUrl)return;const link=document.createElement('a');link.href=updateState.assetUrl;link.rel='noopener noreferrer';link.target='_blank';document.body.append(link);link.click();link.remove();closeUpdateDialog();toast('새 HTML을 내려받은 뒤, 방금 저장한 JSON 백업을 불러오세요.');}}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.choiceValue!==undefined&&state.choice){state.choice.value=button.dataset.choiceValue;for(const item of $('choiceBody').querySelectorAll('button'))item.classList.toggle('active',item===button);return;}if(button.dataset.action)handleAction(button.dataset.action);else if(button.dataset.tab){const next=button.dataset.tab;if(state.tab===next)return;if(next==='settings'&&state.tab!=='settings'&&navigationHistoryReady){history.back();return;}const replace=state.tab!=='settings'&&next!=='settings';state.tab=next;state.fab=false;render();recordNav(replace);window.scrollTo(0,0);}else if(button.dataset.set)setParam(button.dataset.set,button.dataset.value);else if(button.dataset.default){const p=BY_NAME.get(button.dataset.default);if(p)setParam(p.name,p.default);}else if(button.dataset.step){const p=BY_NAME.get(button.dataset.step);if(p){const now=Number(controlValue(p));const next=Math.max(p.min,Math.min(p.max,now+Number(button.dataset.delta)));setParam(p.name,next);}}else if(button.dataset.mult){const n=state.multiplier.get(button.dataset.mult)||1;state.multiplier.set(button.dataset.mult,n===1?10:n===10?100:1);render();}else if(button.dataset.choice)openChoice(button.dataset.choice);else if(button.dataset.edit)openChoice(button.dataset.edit);});
document.addEventListener('change',event=>{if(event.target.dataset.select)setParam(event.target.dataset.select,event.target.value);else if(event.target.dataset.raw)editRaw(event.target.dataset.raw,event.target.value);});
document.addEventListener('input',event=>{if(event.target.id==='searchInput')updateSearch(event.target.value);else if(event.target.id==='choiceNumber')$('choiceRange').value=event.target.value;else if(event.target.id==='choiceRange')$('choiceNumber').value=event.target.value;});
$('backBtn').addEventListener('click',back);$('fab').addEventListener('click',()=>{state.fab=!state.fab;$('fabActions').hidden=!state.fab;$('fab').setAttribute('aria-expanded',String(state.fab));});$('modalCancel').addEventListener('click',back);$('carModal').addEventListener('click',e=>{if(e.target.id==='carModal')dismissCarPicker();});$('confirmCancel').addEventListener('click',back);$('confirmYes').addEventListener('click',commitCar);$('fileInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{await importBackup(file);}catch(error){toast(`불러오기 실패: ${error.message}`,true);}e.target.value='';});
$('choiceCancel').addEventListener('click',closeChoice);$('choiceApply').addEventListener('click',applyChoice);$('choiceOverlay').addEventListener('click',e=>{if(e.target.id==='choiceOverlay')closeChoice();});$('updateOverlay').addEventListener('click',e=>{if(e.target.id==='updateOverlay')closeUpdateDialog();});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('updateOverlay').hidden)closeUpdateDialog();else if(state.choice||state.modal)back();}});window.addEventListener('pagehide',syncPendingUpdateBackup);
state.backup=defaultBackup();restorePendingUpdate();render();initNavHistory();checkForUpdate();

</script>
</body>
